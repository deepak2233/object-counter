[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
# The URL is not set here on purpose: migrations/env.py reads it from the same
# typed Settings the application uses, so there is one source of truth and no
# credentials in a checked-in file. Override per run with:
#   alembic -x db_url=postgresql+psycopg://... upgrade head
sqlalchemy.url =
