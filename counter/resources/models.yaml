# Production catalog: what this service is allowed to serve.
#
# Values may reference environment variables (${VAR}); they are expanded when the
# catalog is read. Add a model here, put its artifact in the model store, and it
# is servable at POST /object-detect?model_name=<name>.
#
# See docs/MULTI_MODEL.md for privately trained models.

default_model: rfcn

models:
  - name: rfcn
    framework: tensorflow-serving
    version: "1"
    labels: mscoco_label_map.json
    # endpoint defaults to COUNTER_TFS_BASE_URL when omitted.
