name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      # Integration tests run against the dialect production uses. Without this
      # they fall back to SQLite and stop proving anything about the PostgreSQL
      # upsert or about concurrent writers.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: counter
          POSTGRES_PASSWORD: counter
          POSTGRES_DB: object_counter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U counter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://counter:counter@localhost:5432/object_counter_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing

      - name: Build image
        run: docker build -t object-counter:${{ github.sha }} .
